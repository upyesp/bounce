<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Bounce</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; font-family: system-ui, sans-serif; }
      #fps {
        position: fixed; top: 8px; left: 10px; z-index: 10;
        color: #9ae6b4; font-size: 12px; font-variant-numeric: tabular-nums;
        pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      }
      #unsupported {
        display: none; position: fixed; inset: 0;
        align-items: center; justify-content: center; flex-direction: column; gap: 0.5rem;
        text-align: center; color: #cbd5e0; padding: 2rem;
      }
      #unsupported h1 { font-size: 1.1rem; margin: 0; }
      #unsupported p { font-size: 0.9rem; margin: 0; opacity: 0.7; max-width: 30ch; }
    </style>
  </head>
  <body>
    <div id="fps">…</div>
    <div id="app"></div>
    <div id="unsupported">
      <h1>WebGPU not available</h1>
      <p>Bounce needs a WebGPU-capable browser — Chrome 121+ (Android) or Safari 17.4+ (iOS).</p>
    </div>
    <script>
      // Feature gate before the engine loads, so unsupported browsers get a clean message.
      if (!navigator.gpu) {
        document.getElementById('app').style.display = 'none';
        document.getElementById('fps').style.display = 'none';
        document.getElementById('unsupported').style.display = 'flex';
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
